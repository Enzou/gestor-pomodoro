<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foco — Técnica Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #17100D;
  --surface:   #211812;
  --surface2:  #2C201A;
  --border:    rgba(255,255,255,0.07);
  --amber:     #E8A245;
  --teal:      #4ECFB0;
  --purple:    #9B8FE8;
  --text:      #F0E2D0;
  --muted:     #7A6A5A;
  --red:       #E05A5A;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.9rem 2rem;
  border-bottom: 1px solid var(--border);
}

.app-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.clock-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 0.06em;
  background: var(--surface);
  padding: 0.3rem 0.75rem;
  border-radius: 50px;
  border: 1px solid var(--border);
}

.sound-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.sound-btn:hover { border-color: var(--amber); color: var(--amber); }

/* ── Main layout ── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 0;
}

@media (max-width: 720px) {
  .main { grid-template-columns: 1fr; }
  .panel-timer { border-right: none; border-bottom: 1px solid var(--border); }
}

/* ── LEFT: Timer ── */
.panel-timer {
  padding: 2rem 1.5rem;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.4rem;
}

/* Mode tabs */
.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface);
  padding: 4px;
  border-radius: 50px;
}

.mode-tab {
  padding: 0.38rem 0.9rem;
  border-radius: 50px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}

.mode-tab.active[data-mode="focus"]     { background: var(--amber);  color: #17100D; }
.mode-tab.active[data-mode="break"]     { background: var(--teal);   color: #17100D; }
.mode-tab.active[data-mode="longBreak"] { background: var(--purple); color: #17100D; }

/* Timer circle */
.timer-wrap {
  position: relative;
  width: 230px;
  height: 230px;
}

.timer-svg { transform: rotate(-90deg); display: block; }
.timer-track { fill: none; stroke: var(--surface2); stroke-width: 7; }

.timer-arc {
  fill: none;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 534.07; /* 2π × 85 */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1), stroke 0.4s;
}

.timer-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.timer-digits {
  font-family: 'JetBrains Mono', monospace;
  font-size: 3.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  transition: color 0.4s;
}

.timer-mode-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}

.timer-running-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--amber);
  opacity: 0;
  transition: opacity 0.3s;
  animation: blink 1.2s step-end infinite;
}

.timer-running-dot.visible { opacity: 1; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Controls */
.controls {
  display: flex;
  gap: 0.65rem;
  align-items: center;
}

.btn-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
}
.btn-icon:hover { background: var(--surface2); color: var(--text); }
.btn-icon:active { transform: scale(0.95); }

.btn-main {
  padding: 0.65rem 2.2rem;
  border: none;
  border-radius: 50px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
}
.btn-main:active { transform: scale(0.97); }
.btn-focus    { background: var(--amber);  color: #17100D; }
.btn-break    { background: var(--teal);   color: #17100D; }
.btn-longbreak{ background: var(--purple); color: #17100D; }

/* Sessions */
.sessions-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.sessions-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.sessions-dots {
  display: flex;
  gap: 8px;
}
.sdot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  transition: all 0.35s;
}
.sdot.done { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 6px rgba(232,162,69,0.4); }

/* Settings */
.settings-toggle {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.38rem 1rem;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.settings-toggle:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

.settings-panel {
  width: 100%;
  background: var(--surface);
  border-radius: 14px;
  padding: 1.25rem;
  display: none;
  border: 1px solid var(--border);
}
.settings-panel.open { display: block; animation: fadeIn 0.2s ease; }

@keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }

.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.75rem;
  margin-bottom: 0.85rem;
}

.setting-item label {
  display: block;
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 5px;
}

.setting-item input[type="number"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 0.5rem;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem;
  font-weight: 700;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  -moz-appearance: textfield;
}
.setting-item input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
.setting-item input[type="number"]:focus { border-color: var(--amber); }

.settings-apply {
  width: 100%;
  padding: 0.55rem;
  background: rgba(232,162,69,0.12);
  border: 1px solid rgba(232,162,69,0.3);
  color: var(--amber);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
}
.settings-apply:hover { background: rgba(232,162,69,0.2); }

/* ── RIGHT panel ── */
.panel-right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Tasks section */
.section-tasks {
  padding: 1.5rem 1.75rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 1rem;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 0.95rem;
  font-style: italic;
  color: var(--muted);
}

.task-counter {
  font-size: 0.72rem;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

.task-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 0.75rem;
}

.task-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 0.8rem;
  border-radius: 9px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.task-input::placeholder { color: var(--muted); }
.task-input:focus { border-color: rgba(232,162,69,0.4); }

.btn-add {
  width: 36px; height: 36px;
  background: var(--amber);
  color: #17100D;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-size: 1.3rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}
.btn-add:hover { opacity: 0.85; }
.btn-add:active { transform: scale(0.93); }

.task-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 190px;
  overflow-y: auto;
  padding-right: 2px;
}

.task-empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  padding: 1.25rem 0;
  font-style: italic;
}

.task-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0.55rem 0.7rem;
  background: var(--surface);
  border-radius: 9px;
  border: 1px solid var(--border);
  transition: all 0.2s;
  animation: slideIn 0.18s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }

.task-item.done { opacity: 0.4; }

.task-check {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  position: relative;
}
.task-check:hover { border-color: var(--amber); }
.task-item.done .task-check { background: var(--amber); border-color: var(--amber); }
.task-item.done .task-check::after {
  content: '✓';
  color: #17100D;
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
}

.task-text {
  flex: 1;
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.35;
  word-break: break-word;
}
.task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

.task-del {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.75rem;
  padding: 2px 4px;
  border-radius: 4px;
  opacity: 0;
  transition: all 0.2s;
  flex-shrink: 0;
}
.task-item:hover .task-del { opacity: 1; }
.task-del:hover { color: var(--red); }

/* Tips section */
.section-tips {
  padding: 1.25rem 1.75rem;
  flex: 1;
  overflow-y: auto;
}

.tips-grid {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 0.9rem;
}

.tip-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0.6rem 0.8rem;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
  transition: all 0.2s;
  cursor: default;
}
.tip-item:hover { background: var(--surface2); }

.tip-icon-wrap {
  width: 30px; height: 30px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}

.tip-text {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.4;
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

/* Toast */
#toast {
  position: fixed;
  bottom: 1.75rem;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.6rem 1.4rem;
  border-radius: 50px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.83rem;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="app-title">
    🍅 <span style="font-style:italic;">Foco</span>
  </div>
  <div class="topbar-right">
    <div class="clock-display" id="clock">00:00:00</div>
    <button class="sound-btn" id="soundBtn" title="Alternar sonido" onclick="toggleSound()">🔔</button>
  </div>
</div>

<main class="main">

  <!-- ═══════════ LEFT: TIMER ═══════════ -->
  <div class="panel-timer">

    <!-- Mode tabs -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="focus"     onclick="setMode('focus')">Concentración</button>
      <button class="mode-tab"        data-mode="break"     onclick="setMode('break')">Descanso</button>
      <button class="mode-tab"        data-mode="longBreak" onclick="setMode('longBreak')">Descanso largo</button>
    </div>

    <!-- Timer circle -->
    <div class="timer-wrap">
      <svg class="timer-svg" width="230" height="230" viewBox="0 0 230 230" aria-hidden="true">
        <circle class="timer-track" cx="115" cy="115" r="85"/>
        <circle class="timer-arc" id="timerArc" cx="115" cy="115" r="85"
          stroke="#E8A245"
          stroke-dasharray="534.07"
          stroke-dashoffset="0"/>
      </svg>
      <div class="timer-center">
        <div class="timer-digits" id="timerDisplay">25:00</div>
        <div class="timer-mode-label" id="modeLabel">Concentración</div>
        <div class="timer-running-dot" id="runningDot"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-icon" onclick="resetTimer()" title="Reiniciar">↺</button>
      <button class="btn-main btn-focus" id="startBtn" onclick="toggleTimer()">Comenzar</button>
      <button class="btn-icon" onclick="skipToNext()" title="Saltar">⏭</button>
    </div>

    <!-- Sessions -->
    <div class="sessions-wrap">
      <div class="sessions-label">Sesiones completadas</div>
      <div class="sessions-dots" id="sessionsDots">
        <div class="sdot" id="sd0"></div>
        <div class="sdot" id="sd1"></div>
        <div class="sdot" id="sd2"></div>
        <div class="sdot" id="sd3"></div>
      </div>
    </div>

    <!-- Settings toggle -->
    <button class="settings-toggle" onclick="toggleSettings()">
      ⚙ Ajustar tiempos
    </button>

    <!-- Settings panel -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-grid">
        <div class="setting-item">
          <label>Concentración</label>
          <input type="number" id="focusInput" value="25" min="1" max="120">
          <div style="font-size:0.62rem;color:var(--muted);text-align:center;margin-top:3px;">minutos</div>
        </div>
        <div class="setting-item">
          <label>Descanso</label>
          <input type="number" id="breakInput" value="5" min="1" max="60">
          <div style="font-size:0.62rem;color:var(--muted);text-align:center;margin-top:3px;">minutos</div>
        </div>
        <div class="setting-item">
          <label>Desc. largo</label>
          <input type="number" id="longBreakInput" value="15" min="5" max="60">
          <div style="font-size:0.62rem;color:var(--muted);text-align:center;margin-top:3px;">minutos</div>
        </div>
      </div>
      <button class="settings-apply" onclick="applySettings()">Aplicar cambios ✓</button>
    </div>

  </div>

  <!-- ═══════════ RIGHT: TASKS + TIPS ═══════════ -->
  <div class="panel-right">

    <!-- Tasks -->
    <div class="section-tasks">
      <div class="section-header">
        <span class="section-title">Tareas del día</span>
        <span class="task-counter" id="taskCounter">0 / 0</span>
      </div>
      <div class="task-input-row">
        <input class="task-input" id="taskInput"
          placeholder="Escribí una tarea y presioná Enter…"
          onkeydown="if(event.key==='Enter') addTask()" maxlength="100">
        <button class="btn-add" onclick="addTask()" title="Agregar">+</button>
      </div>
      <div class="task-list" id="taskList">
        <div class="task-empty">Tu lista está vacía. ¡Agregá tu primera tarea!</div>
      </div>
    </div>

    <!-- Tips -->
    <div class="section-tips">
      <div class="section-header">
        <span class="section-title">Consejos de bienestar</span>
      </div>
      <div class="tips-grid" id="tipsList"></div>
    </div>

  </div>
</main>

<div id="toast"></div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const R  = 85;
const C  = +(2 * Math.PI * R).toFixed(2); // 534.07

const TIPS = [
  { icon:'💧', text:'Tomá agua — hidratarse mejora la concentración y el estado de ánimo.',  bg:'rgba(55,138,221,0.1)'  },
  { icon:'🚶', text:'Pausa activa — caminá 2 minutos entre sesiones para resetear el cuerpo.', bg:'rgba(30,158,117,0.1)'  },
  { icon:'👁️', text:'Regla 20-20-20: cada 20 min, mirá algo a 6 m de distancia por 20 segundos.', bg:'rgba(127,119,221,0.1)' },
  { icon:'🧍', text:'Pararme — levantarme unos minutos reduce la fatiga y mejora la circulación.', bg:'rgba(232,162,69,0.1)'  },
  { icon:'🔄', text:'Ejercitar espalda y hombros — círculos, extensiones y rotaciones de cuello.',  bg:'rgba(208,90,48,0.1)'   },
  { icon:'🌬️', text:'Respiración 4-7-8: inhalá 4s, retené 7s, exhalá 8s. Relaja el sistema nervioso.', bg:'rgba(78,207,176,0.1)'  },
  { icon:'😌', text:'Cerrar los ojos 20 segundos — descanso visual para reducir la tensión ocular.', bg:'rgba(155,143,232,0.1)' },
  { icon:'🙆', text:'Estirar cuello, muñecas y piernas — previene tensión muscular y lesiones.',     bg:'rgba(99,153,34,0.1)'   },
  { icon:'🌿', text:'Mirá algo verde o natural unos instantes — baja el cortisol y recarga la atención.', bg:'rgba(30,158,117,0.1)' },
];

// ─── State ───────────────────────────────────────────────────────────────────
let mode       = 'focus';
let isRunning  = false;
let timeLeft   = 25 * 60;
let totalTime  = 25 * 60;
let sessions   = 0;
let interval   = null;
let soundOn    = true;
let taskIdSeq  = 0;
const tasks    = [];
const cfg      = { focus: 25, break: 5, longBreak: 15 };

// ─── Clock ───────────────────────────────────────────────────────────────────
function updateClock() {
  const n = new Date();
  const p = v => String(v).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

// ─── Timer UI ─────────────────────────────────────────────────────────────────
function fmt(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

const COLORS = { focus:'#E8A245', break:'#4ECFB0', longBreak:'#9B8FE8' };
const LABELS = { focus:'Concentración', break:'Descanso', longBreak:'Descanso largo' };
const BTN_CLS = { focus:'btn-focus', break:'btn-break', longBreak:'btn-longbreak' };

function renderTimerUI() {
  // digits
  document.getElementById('timerDisplay').textContent = fmt(timeLeft);
  document.getElementById('timerDisplay').style.color = COLORS[mode];

  // arc
  const progress = totalTime > 0 ? timeLeft / totalTime : 0;
  const offset   = C * (1 - progress);
  const arc      = document.getElementById('timerArc');
  arc.style.strokeDashoffset = offset;
  arc.style.stroke = COLORS[mode];

  // running dot
  const dot = document.getElementById('runningDot');
  dot.classList.toggle('visible', isRunning);
  dot.style.background = COLORS[mode];

  // mode label
  document.getElementById('modeLabel').textContent = LABELS[mode];

  // start btn
  const btn = document.getElementById('startBtn');
  btn.className = `btn-main ${BTN_CLS[mode]}`;
  btn.textContent = isRunning ? 'Pausar' : (timeLeft < totalTime ? 'Continuar' : 'Comenzar');

  // mode tabs
  document.querySelectorAll('.mode-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === mode));
}

function renderSessions() {
  const pos = sessions % 4;
  for (let i = 0; i < 4; i++) {
    document.getElementById(`sd${i}`).className = `sdot${i < pos ? ' done' : ''}`;
  }
}

// ─── Timer logic ──────────────────────────────────────────────────────────────
function setMode(m, autoRender = true) {
  clearInterval(interval);
  isRunning = false;
  mode      = m;
  timeLeft  = cfg[m] * 60;
  totalTime = timeLeft;
  if (autoRender) renderTimerUI();
}

function toggleTimer() {
  if (isRunning) {
    clearInterval(interval);
    isRunning = false;
  } else {
    isRunning = true;
    interval  = setInterval(tick, 1000);
  }
  renderTimerUI();
}

function tick() {
  if (timeLeft <= 0) {
    clearInterval(interval);
    isRunning = false;
    onTimerEnd();
    return;
  }
  timeLeft--;
  renderTimerUI();
}

function onTimerEnd() {
  if (soundOn) playBeep();

  if (mode === 'focus') {
    sessions++;
    renderSessions();
    const nextMode = sessions % 4 === 0 ? 'longBreak' : 'break';
    setMode(nextMode);
    const msgs = {
      break:     '🎉 ¡Sesión completada! Tomá un descanso.',
      longBreak: '🌿 ¡Cuatro sesiones! Merecés un descanso largo.'
    };
    showToast(msgs[nextMode]);
  } else {
    setMode('focus');
    showToast('💪 ¡Descanso terminado! A concentrarse de nuevo.');
  }
  renderTimerUI();
}

function resetTimer() {
  clearInterval(interval);
  isRunning = false;
  timeLeft  = cfg[mode] * 60;
  totalTime = timeLeft;
  renderTimerUI();
}

function skipToNext() {
  clearInterval(interval);
  isRunning = false;
  timeLeft  = 0;
  onTimerEnd();
}

// ─── Sound ────────────────────────────────────────────────────────────────────
function playBeep() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 660;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 1.0);
    // second note
    const osc2 = ctx.createOscillator();
    const g2   = ctx.createGain();
    osc2.connect(g2); g2.connect(ctx.destination);
    osc2.frequency.value = 880; osc2.type = 'sine';
    g2.gain.setValueAtTime(0.2, ctx.currentTime + 0.15);
    g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.1);
    osc2.start(ctx.currentTime + 0.15);
    osc2.stop(ctx.currentTime + 1.1);
  } catch(e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔔' : '🔕';
  showToast(soundOn ? 'Sonido activado' : 'Sonido desactivado');
}

// ─── Settings ─────────────────────────────────────────────────────────────────
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

function applySettings() {
  const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
  cfg.focus     = clamp(parseInt(document.getElementById('focusInput').value)    || 25, 1, 120);
  cfg.break     = clamp(parseInt(document.getElementById('breakInput').value)    || 5,  1,  60);
  cfg.longBreak = clamp(parseInt(document.getElementById('longBreakInput').value)|| 15, 5,  60);

  // Sync inputs back (in case clamped)
  document.getElementById('focusInput').value    = cfg.focus;
  document.getElementById('breakInput').value    = cfg.break;
  document.getElementById('longBreakInput').value= cfg.longBreak;

  setMode(mode);
  document.getElementById('settingsPanel').classList.remove('open');
  showToast('Tiempos actualizados ✓');
}

// ─── Tasks ────────────────────────────────────────────────────────────────────
function addTask() {
  const input = document.getElementById('taskInput');
  const text  = input.value.trim();
  if (!text) return;
  tasks.push({ id: ++taskIdSeq, text, done: false });
  input.value = '';
  renderTasks();
  input.focus();
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; renderTasks(); }
}

function deleteTask(id) {
  const i = tasks.findIndex(t => t.id === id);
  if (i > -1) { tasks.splice(i, 1); renderTasks(); }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const done = tasks.filter(t => t.done).length;
  document.getElementById('taskCounter').textContent = `${done} / ${tasks.length}`;

  if (!tasks.length) {
    list.innerHTML = '<div class="task-empty">Tu lista está vacía. ¡Agregá tu primera tarea!</div>';
    return;
  }

  // Pending first, done at bottom
  const sorted = [...tasks.filter(t=>!t.done), ...tasks.filter(t=>t.done)];

  list.innerHTML = sorted.map(t => `
    <div class="task-item${t.done ? ' done' : ''}">
      <button class="task-check" onclick="toggleTask(${t.id})" title="${t.done ? 'Desmarcar' : 'Completar'}"></button>
      <span class="task-text">${esc(t.text)}</span>
      <button class="task-del" onclick="deleteTask(${t.id})" title="Eliminar">✕</button>
    </div>
  `).join('');
}

// ─── Tips ─────────────────────────────────────────────────────────────────────
function renderTips() {
  document.getElementById('tipsList').innerHTML = TIPS.map(t => `
    <div class="tip-item">
      <div class="tip-icon-wrap" style="background:${t.bg}">${t.icon}</div>
      <span class="tip-text">${t.text}</span>
    </div>
  `).join('');
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = '0', 3000);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderTimerUI();
renderSessions();
renderTasks();
renderTips();
</script>
